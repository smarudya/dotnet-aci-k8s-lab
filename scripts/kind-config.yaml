kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: catalog-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081   # http://catalog.localtest.me:8081 (avoids needing port 80 on the host)
        protocol: TCP
