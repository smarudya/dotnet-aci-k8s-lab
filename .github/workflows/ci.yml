name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/CatalogApi.Tests/CatalogApi.Tests.csproj -c Release

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only: no registry login, no push, no secrets required.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: catalog-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8080:8080 catalog-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/api/products/1
      - name: Container logs on failure
        if: failure()
        run: docker logs api

  k8s-validate:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validate kustomize output
        run: kubectl kustomize k8s | kubeconform -strict -summary -kubernetes-version 1.30.0
      - name: Validate optional manifests
        run: kubeconform -strict -summary -kubernetes-version 1.30.0 k8s/optional/
